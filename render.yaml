services:
  # Backend Express Node.js Service
  - type: web
    name: Seva360-backend
    env: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true

  # Frontend React Vite Static Site
  - type: web
    name: darshan360-frontend
    env: static
    rootDir: Frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
