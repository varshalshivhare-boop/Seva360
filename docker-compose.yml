version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seva360-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/seva360
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=seva360_secret_key
    depends_on:
      - mongo
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seva360-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: seva360-ai
    ports:
      - "8000:8000"
    restart: always

  mongo:
    image: mongo:latest
    container_name: seva360-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: seva360-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo-data:
