<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

<!-- Suppressed Bottom Nav / Side Nav -->
<main class="flex-grow flex items-center justify-center py-margin-desktop px-margin-mobile md:px-margin-desktop relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center opacity-30">
<div class="w-[800px] h-[800px] rounded-full border border-surface-variant blur-3xl absolute -top-[400px] -right-[200px]"></div>
<div class="w-[600px] h-[600px] rounded-full bg-primary-fixed blur-3xl absolute -bottom-[200px] -left-[100px] opacity-20"></div>
</div>
<div class="w-full max-w-[480px] z-10 relative">
<!-- Brand & Title -->
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-high mb-6 shadow-sm border border-surface-variant/50"><a href="{{DATA:SCREEN:SCREEN_2}}" class="flex items-center justify-center w-full h-full"><span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">mosque</span></a></div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Create an Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join Darshan360 to manage your spiritual journey.</p>
</div>
<!-- Sign Up Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_8px_24px_rgba(87,0,0,0.05)] border border-surface-variant/30">
<form action="#" class="space-y-6" method="POST">
<!-- Full Name Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline/20 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" id="fullName" name="fullName" placeholder="e.g. Rahul Sharma" required="" type="text">
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline/20 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Phone Number Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">call</span>
</div>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline/20 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" id="phone" name="phone" placeholder="+91 98765 43210" required="" type="tel">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border border-outline/20 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder-outline-variant transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="mt-2 font-label-caps text-label-caps text-on-surface-variant/70 normal-case">Must be at least 8 characters long.</p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-4">
<div class="flex items-center h-5">
<input class="w-4 h-4 rounded border-outline/30 text-primary focus:ring-primary focus:ring-offset-surface-container-lowest bg-surface-container-low cursor-pointer" id="terms" name="terms" required="" type="checkbox">
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-[14px] text-on-surface-variant cursor-pointer" for="terms">
                                I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                            </label>
</div>
</div>
<!-- Submit Button -->
<a href="{{DATA:SCREEN:SCREEN_4}}" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-caps text-label-caps text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98]">Create Account</a>
</form>
<!-- Alternate Actions -->
<div class="mt-8 text-center border-t border-surface-variant/50 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:underline underline-offset-4 ml-1 transition-all" href="{{DATA:SCREEN:SCREEN_12}}">Back to Login</a>
</p>
</div>

</div>

<p class="font-label-caps text-label-caps text-on-surface-variant/60">© 2024 Darshan360 Pilgrimage Management. All rights reserved.</p>
